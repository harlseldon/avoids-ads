# Servidor DHCP de la casa. Sustituye al del ONT de Totalplay, que no permite
# elegir qué DNS reparte (los campos salen bloqueados por firmware).
#
# Esto NO es un servidor DNS: `port=0` apaga por completo esa parte de dnsmasq.
# Solo reparte direcciones, y en cada una incluye a Pi-hole como DNS. Por eso
# puede correr con `network_mode: host` sin pelearse por el :53 con Pi-hole ni
# con el stub de systemd-resolved.
port=0

# Solo la interfaz de la LAN. `bind-interfaces` evita que escuche en comodín.
interface=wlan0
bind-interfaces

# Este es el único DHCP de la red: responde también a peticiones de clientes
# con concesiones viejas del ONT, en vez de ignorarlas y hacerles esperar.
dhcp-authoritative

# Rango. Empieza en .20 para dejar .2-.19 libres para direcciones fijas.
# Concesión de 12 h: bastante más corta que las 72 h del ONT, para que un
# cambio de configuración se propague por la casa en medio día y no en tres.
dhcp-range=192.168.100.20,192.168.100.250,12h

# Opción 3 — puerta de enlace. IMPRESCINDIBLE ponerla a mano: por defecto
# dnsmasq se anuncia a sí mismo como router, y este equipo no lo es. Sin esta
# línea la casa se queda sin salida a internet.
dhcp-option=3,192.168.100.1

# Opción 6 — DNS. El motivo de todo este montaje.
dhcp-option=6,192.168.100.7

# Concesiones persistentes: sobreviven a reinicios del contenedor.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Deja rastro de cada DISCOVER/OFFER/ACK en el log del contenedor.
# Útil mientras se estabiliza; se puede quitar después.
log-dhcp
